name: Monthly refresh

# Two ways to start a run:
#   - schedule: the monthly automated run. Fires at 03:00 UTC on the 22nd -- deliberately
#     off the top of the hour and off the 1st, since GitHub's scheduler is busiest at
#     round times and a busy queue can delay or drop a run.
#   - workflow_dispatch: a manual run from the Actions tab, with a test_mode checkbox
#     that runs `refresh.py --test` instead of a real run (5 channels, no writes, no
#     refresh) -- for confirming the workflow itself works without touching the database.
on:
  schedule:
    - cron: "0 3 22 * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: refresh.py --test (5 channels, no writes, no refresh)"
        required: false
        type: boolean
        default: true

# Named, not auto-generated from the branch/event: a scheduled run and a manual dispatch
# must never be allowed to overlap even though they're different trigger types, and the
# default concurrency group (which includes the ref) would treat them as unrelated.
# cancel-in-progress stays false -- a run stopped mid-write is worse than a second run
# simply waiting, since refresh.py's hard gates and the refresh-last ordering exist
# precisely so a run either finishes cleanly or leaves videos_scored untouched.
concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Measured real runs take about 14 minutes (three views refreshed, since step 10f).
    # 60 minutes is not "give it more time" headroom -- a run approaching that is a hung
    # job, not a slow one, and a hung job holding the concurrency group blocks every
    # future run (including manual ones) until it's manually cancelled.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ingestion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version this project runs locally.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Healthchecks.io monitoring: /start before the real run, then either a plain ping
      # (success) or /fail (failure or cancellation) after. Skipped entirely in test mode
      # -- a test run must never count as a real refresh -- and skipped with a log
      # warning, not a failure, if the secret was never configured. None of the ping
      # steps can affect the job's own result: continue-on-error: true, and curl's own
      # timeout/retries keep a slow or unreachable healthcheck endpoint from ever being
      # the reason this job is slow or red.
      - name: Check for Healthchecks.io ping URL
        if: inputs.test_mode != true
        id: healthcheck
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "::warning::HEALTHCHECK_PING_URL is not set -- skipping Healthchecks.io pings for this run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Healthchecks.io (start)
        if: inputs.test_mode != true && steps.healthcheck.outputs.enabled == 'true'
        continue-on-error: true
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$PING_URL/start"

      - name: Run the 30-day refresh
        env:
          # Read from GitHub's encrypted secret store at run time, never hardcoded here.
          # GitHub automatically masks any of these values if they appear in the log --
          # including inside an error message -- so a failure elsewhere in the run can't
          # leak them just by printing an exception.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # The sentinel check in refresh_scoring_view.py reads videos_scored as anon --
          # the same read path a real visitor uses, including the anon grant itself.
          # Same project as SUPABASE_URL above, just under the name the front end's own
          # code (and refresh_scoring_view.py's environment fallback) expects.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # set -e: if refresh.py exits non-zero, this step (and the whole run) is
          # reported as failed -- nothing here catches or downgrades that, which is what
          # makes a failed run show red and trigger GitHub's own email notification.
          set -euo pipefail

          if [ "${{ inputs.test_mode }}" = "true" ]; then
            python refresh.py --test
          else
            python refresh.py
          fi

      - name: Ping Healthchecks.io (success)
        if: inputs.test_mode != true && steps.healthcheck.outputs.enabled == 'true' && success()
        continue-on-error: true
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$PING_URL"

      - name: Ping Healthchecks.io (failure)
        if: inputs.test_mode != true && steps.healthcheck.outputs.enabled == 'true' && (failure() || cancelled())
        continue-on-error: true
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$PING_URL/fail"
